<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travelgram</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="bg-surface-color">
        <nav class="container" id="primary-menu">
          <a href="#"> <img src="/assets/Logo.svg" alt="" /> </a>

          <ul>
            <li>
              <a href="#">
                <img src="/assets/icons/MagnifyingGlass.svg" alt="" />
              </a>
            </li>
            <li><a href="#">Explorar</a></li>
            <li><a href="#">Minhas Viagens</a></li>
            <li>
              <a href="#"><img src="/assets/Profilepic.png" alt="" /> </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="bg-surface-color">
      <div class="profile container ">
        <div class="profile-info">
          <img src="/assets/Profilepic.png" alt="" />
          
          <div>
            <h1>Isabela Torres</h1>
            <p>
              Amante de viagens, cultura e gastronomia. 🌍✈️ <br> compartilho as
              histórias registradas em cada clique, explorando cantinhos
              fascinantes do nosso planeta a partir da movimentada cidade de São
              Paulo. 🏙️📸
            </p>
          </div>
        </div>
        <div class="profile-icons">
          <div class="profile-icon">
            <img src="/assets/icons/MapPin.svg" alt="" />
            <p>São Paulo, Brasil</p>
          </div>
          <div class="profile-icon">
            <img src="/assets/icons/AirplaneTilt.svg" alt="" />
            <p>37 países</p>
          </div>
          <div class="profile-icon">
            <img src="/assets/icons/Image.svg" alt="" />
            <p>240 fotos</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
